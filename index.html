/* =========================
   HELPERS
========================= */

function q(topic,question,answer,explanation=""){
return {topic,question,answer,explanation};
}

function n(i,min,max){
return min+(i%(max-min+1));
}


/* =========================
   MATH 132
========================= */

function math132(mode){

let a=[];

for(let i=1;i<=100;i++){

let t=topics["MATH 132"][(i-1)%9];

if(t==="Equation of a straight line"){
let m=(i%7)+1;
let x=i%6+1;
let y=m*x+2;
a.push(q(t,
`Find the gradient of the line y = ${m}x + 2.`,
`${m}`,
`In y = mx + c, m is the gradient.`));

}else if(t==="Equation of a circle"){
let r=(i%8)+2;
a.push(q(t,
`Find the radius of x² + y² = ${r*r}.`,
`${r}`,
`Compare x² + y² = r².`));

}else if(t==="Parabola"){
let h=i%5;
let k=i%6;
a.push(q(t,
`State the vertex of y = (x - ${h})² + ${k}.`,
`(${h}, ${k})`,
`The vertex form is y=(x-h)²+k.`));

}else if(t==="Hyperbola"){
let k=(i%9)+2;
let x=(i%5)+1;
a.push(q(t,
`If xy = ${k}, find y when x = ${x}.`,
`${k/x}`,
`Use y = k/x.`));

}else if(t==="Ellipse"){
let A=(i%5)+3;
let B=(i%4)+2;
a.push(q(t,
`For x²/${A*A} + y²/${B*B} = 1, state the semi-major and semi-minor axes.`,
`${Math.max(A,B)} and ${Math.min(A,B)}`,
`The square roots of the denominators give the semi-axis lengths.`));

}else if(t==="Vector operations"){
let x=i%6+1;
let y=i%5+2;
a.push(q(t,
`Find the magnitude of vector (${x}, ${y}).`,
`√(${x*x+y*y})`,
`Magnitude = √(x²+y²).`));

}else if(t==="Vectors in Cartesian coordinates"){
let x1=i%5,y1=i%4,x2=x1+2,y2=y1+3;
a.push(q(t,
`Find vector AB if A(${x1},${y1}) and B(${x2},${y2}).`,
`(2, 3)`,
`AB = B - A.`));

}else if(t==="Equation of a line using vectors and Cartesian coordinates"){
let x=i%5,y=i%4;
a.push(q(t,
`Write a vector equation of a line through (${x},${y}) with direction vector (2,3).`,
`r = (${x},${y}) + λ(2,3)`,
`A line is position vector plus a scalar multiple of its direction vector.`));

}else{
let x=i%5+1;
a.push(q(t,
`A plane has normal vector (1,2,${x}). What is its normal vector?`,
`(1,2,${x})`,
`The vector perpendicular to the plane is its normal vector.`));
}

}

return mode==="cat"?a.slice(0,30):a;
}


/* =========================
   CHEM 110
========================= */

function chem110(mode){

let a=[];

const masses={
H:1,C:12,O:16,Na:23,Cl:35.5
};

for(let i=1;i<=100;i++){

let t=topics["CHEM 110"][(i-1)%6];

if(t==="Stoichiometry - mole concept"){

let mass=i%10+2;
let molar=18;

a.push(q(t,
`Calculate the number of moles in ${mass} g of H₂O.`,
`${mass}/18 mol`,
`Moles = mass ÷ molar mass. H₂O has molar mass 18 g mol⁻¹.`));

}else if(t==="Quantum theory and atomic structures"){

let nlevel=i%4+1;
a.push(q(t,
`How many orbitals are present in the n = ${nlevel} shell?`,
`${nlevel*nlevel}`,
`The number of orbitals in shell n is n².`));

}else if(t==="History of the atom"){

let names=[
"Dalton","Thomson","Rutherford","Bohr"
];

let name=names[i%names.length];

a.push(q(t,
`Which atomic model is associated with ${name}?`,
`${name}'s atomic model`,
`The scientist contributed a major model in the development of atomic theory.`));

}else if(t==="Trends in physical properties of group elements"){

a.push(q(t,
`What generally happens to atomic radius down a group?`,
`It increases.`,
`Additional electron shells are added down a group.`));

}else if(t==="Graphic materials"){

a.push(q(t,
`What type of graph is commonly used to show a continuous relationship between two variables?`,
`A line graph.`,
`Continuous data can be represented effectively using a line graph.`));

}else{

a.push(q(t,
`Which type of bond involves sharing of electrons between atoms?`,
`Covalent bond.`,
`Covalent bonding involves shared electron pairs.`));

}

}

return mode==="cat"?a.slice(0,30):a;
}


/* =========================
   MATH 112
========================= */

function math112(mode){

let a=[];

for(let i=1;i<=100;i++){

let t=topics["MATH 112"][(i-1)%9];

if(t==="Sequence and series"){

let first=i%6+1;
let d=i%5+1;
let term=first+4*d;

a.push(q(t,
`Find the 5th term of the arithmetic sequence beginning ${first}, with common difference ${d}.`,
`${term}`,
`aₙ = a + (n-1)d.`));

}else if(t==="Trigonometry"){

a.push(q(t,
`What is sin 30°?`,
`1/2`,
`This is a standard trigonometric value.`));

}else if(t==="Set theory"){

a.push(q(t,
`If A={1,2,3} and B={3,4,5}, find A ∩ B.`,
`{3}`,
`The intersection contains elements common to both sets.`));

}else if(t==="Mathematical logics"){

a.push(q(t,
`What is the truth value of “2 is greater than 5”?`,
`False`,
`2 is not greater than 5.`));

}else if(t==="Number systems"){

let decimal=i%20+1;

a.push(q(t,
`Convert decimal ${decimal} to binary.`,
`Use repeated division by 2.`,
`Divide the decimal number repeatedly by 2 and read the remainders upward.`));

}else if(t==="Relations and mapping"){

a.push(q(t,
`What is the domain of a relation?`,
`The set of input elements.`,
`The domain contains the first components or inputs.`));

}else if(t==="Functions"){

let x=i%7+1;
a.push(q(t,
`If f(x)=2x+3, find f(${x}).`,
`${2*x+3}`,
`Substitute x=${x} into the function.`));

}else if(t==="Permutations and combinations"){

let r=2;
let nn=5+i%4;

a.push(q(t,
`Calculate ${nn}P${r}.`,
`${nn*(nn-1)}`,
`nPr = n(n-1) for r=2.`));

}else{

let nval=5+i%5;

a.push(q(t,
`What is the coefficient of x in (1+x)^${nval}?`,
`${nval}`,
`The coefficient of x is n in (1+x)^n.`));

}

}

return mode==="cat"?a.slice(0,30):a;
}

/* =========================
   CHEM 120
========================= */

function chem120(mode){

let a=[];

for(let i=1;i<=100;i++){

let t=topics["CHEM 120"][(i-1)%7];

if(t==="Gases and Kinetic Molecular Theory"){

let V1=2;
let V2=4;
let T1=300;
let T2=600;

a.push(q(t,
`At constant pressure, a gas has volume ${V1} L at ${T1} K. What is its volume at ${T2} K?`,
`${V2} L`,
`Charles' law states V₁/T₁ = V₂/T₂.`));

}else if(t==="Chemical Equilibrium"){

a.push(q(t,
`What happens to an equilibrium system when a reactant is added?`,
`The equilibrium shifts toward products, if the added species is a reactant.`,
`This follows Le Chatelier's principle.`));

}else if(t==="Ionic Equilibrium"){

a.push(q(t,
`What is an equilibrium involving ions in solution called?`,
`Ionic equilibrium.`,
`It involves reversible processes involving ions in solution.`));

}else if(t==="Acids and Bases"){

let pH=i%6+1;

a.push(q(t,
`A solution has pH ${pH}. Is it acidic or basic?`,
`${pH<7?"Acidic":pH===7?"Neutral":"Basic"}`,
`pH below 7 is acidic, 7 is neutral and above 7 is basic.`));

}else if(t==="Thermochemistry"){

let m=2;
let c=4.18;
let dt=10;

a.push(q(t,
`Calculate q for ${m} g of water heated through ${dt} °C. Use c = 4.18 J g⁻¹ °C⁻¹.`,
`${m*c*dt} J`,
`Use q = mcΔT.`));

}else if(t==="Chemical Kinetics"){

a.push(q(t,
`What does chemical kinetics study?`,
`The rates of chemical reactions and factors affecting them.`,
`Kinetics deals with reaction speed and its dependence on conditions.`));

}else{

a.push(q(t,
`What is oxidation?`,
`Loss of electrons.`,
`Oxidation can be remembered as loss of electrons.`));

}

}

return mode==="cat"?a.slice(0,30):a;
}

/* =========================
   TOPIC DROPDOWN
========================= */

const courseBox=document.getElementById("course");
const topicBox=document.getElementById("topic");

courseBox.addEventListener("change",()=>{

topicBox.innerHTML='<option value="">All Topics</option>';

const list=topics[courseBox.value]||[];

list.forEach(t=>{

let option=document.createElement("option");

option.value=t;
option.textContent=t;

topicBox.appendChild(option);

});

});


/* =========================
   FILTER
========================= */

function filtered(list){

let t=topicBox.value;

return t ? list.filter(x=>x.topic===t) : list;

}


/* =========================
   DISPLAY
========================= */

function display(title,list){

const content=document.getElementById("content");

content.innerHTML="";

let card=document.createElement("div");

card.className="card";

let h=document.createElement("h2");

h.textContent=title+" ("+list.length+" questions)";

card.appendChild(h);

list.forEach((item,i)=>{

let box=document.createElement("div");

box.className="question";

box.innerHTML=`

<strong>${i+1}. ${item.question}</strong>

<div class="topic">Topic: ${item.topic}</div>

<button onclick="toggle(${i})">
Show Answer
</button>

<div class="answer" id="a${i}">
<strong>Answer:</strong> ${item.answer}
<br><br>
<strong>Explanation:</strong> ${item.explanation}
</div>

`;

card.appendChild(box);

});

content.appendChild(card);

}


/* =========================
   CAT / REVISION
========================= */

function showCAT(){

let c=courseBox.value;

if(!c){
alert("Select a unit first.");
return;
}

display(
c+" — CAT Practice",
filtered(questionBank[c].cat)
);

}

function showRevision(){

let c=courseBox.value;

if(!c){
alert("Select a unit first.");
return;
}

display(
c+" — Revision Questions",
filtered(questionBank[c].revision)
);

}


function toggle(i){

let x=document.getElementById("a"+i);

x.style.display=
x.style.display==="block"?"none":"block";

}

`;

function makeMock(number){

let c=courseBox.value;

let questions=[
...questionBank[c].cat,
...questionBank[c].revision
].slice(0,30);

let text=
"EDUSCIENCE MCE STUDY HUB\n"+
c+
" — ORIGINAL MOCK PAPER "+
number+
