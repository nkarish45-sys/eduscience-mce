.stats{

.stat{
    background:#eaf2fb;

    border-radius:10px;
    text-align:center;

.stat strong{
    display:block;
    font-size:25px;
    color:#123c69;
}

label{
    font-weight:bold;
    display:block;
    margin-top:12px;
    margin-bottom:6px;
}

select,
button{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    background:#123c69;
    color:white;
    border:none;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    opacity:.9;
}

.button-row{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:10px;
}

.question{
    border:1px solid #ddd;
    border-radius:10px;
    padding:18px;
    margin:15px 0;
    background:#fafafa;
}

.question h3{
    margin-top:0;
}

.option{
    display:block;
    background:white;
    border:1px solid #ddd;
    padding:10px;
    border-radius:7px;
    margin:7px 0;
    cursor:pointer;
}

.answer{
    display:none;
    margin-top:12px;
    padding:12px;
    background:#e8f5e9;
    border-left:5px solid #2e7d32;
    border-radius:5px;
}

.topic-title{
    color:#123c69;
}

.hidden{
    display:none;
}

footer{
    text-align:center;
    padding:25px;
    color:#666;
}

/* =========================================================
   COMBINE QUESTION BANK
========================================================= */

const questionBank = {
    "MATH 132":{
        cat:math132CAT,
        revision:math132Revision
    }
};


/* =========================================================
   LINKED DROPDOWNS
========================================================= */

const universitySelect = document.getElementById("university");
const courseSelect = document.getElementById("course");
const topicSelect = document.getElementById("topic");

courseSelect.addEventListener("change", function(){

    const selectedCourse = this.value;

    topicSelect.innerHTML =
        '<option value="">Select Topic</option>';

    if(courseTopics[selectedCourse]){

        courseTopics[selectedCourse].forEach(function(topic){

            const option = document.createElement("option");

            option.value = topic;
            option.textContent = topic;

            topicSelect.appendChild(option);

        });

    }

});


/* =========================================================
   DISPLAY QUESTIONS
========================================================= */

function getSelectedTopic(){

    return topicSelect.value;

}


function filterQuestions(questions){

    const selectedTopic = getSelectedTopic();

    if(!selectedTopic){
        return questions;
    }

    return questions.filter(function(question){
        return question.topic === selectedTopic;
    });

}


function showQuestions(questions,title){

    const area = document.getElementById("questionArea");

    area.innerHTML = "";

    const wrapper = document.createElement("div");

    wrapper.className = "card";

    const heading = document.createElement("h2");

    heading.textContent = title;

    wrapper.appendChild(heading);

    const course = courseSelect.value;

    if(!questionBank[course]){

        const message = document.createElement("p");

        message.textContent =
            "The expanded question bank for this course will be added next.";

        wrapper.appendChild(message);

        area.appendChild(wrapper);

        return;
    }


    const filtered = filterQuestions(questions);


    if(filtered.length === 0){

        const message = document.createElement("p");

        message.textContent =
            "No questions found for this topic.";

        wrapper.appendChild(message);

        area.appendChild(wrapper);

        return;
    }


    filtered.forEach(function(question,index){

        const box = document.createElement("div");

        box.className = "question";


        const number = document.createElement("h3");

        number.textContent =
            (index + 1) + ". " + question.q;

        box.appendChild(number);


        if(question.options){

            question.options.forEach(function(option){

                const label = document.createElement("label");

                label.className = "option";

                label.innerHTML =
                    '<input type="radio" name="question' +
                    index +
                    '" value="' +
                    option.replace(/"/g,"&quot;") +
                    '"> ' +
                    option;

                box.appendChild(label);

            });


            const checkButton =
                document.createElement("button");

            checkButton.textContent =
                "Show Answer";

            checkButton.onclick = function(){

                answerBox.style.display = "block";

            };

            box.appendChild(checkButton);

        }else{

            const answerButton =
                document.createElement("button");

            answerButton.textContent =
                "Show Answer";

            answerButton.onclick = function(){

                answerBox.style.display = "block";

            };

            box.appendChild(answerButton);

        }


        const answerBox =
            document.createElement("div");

        answerBox.className = "answer";

        answerBox.innerHTML =
            "<strong>Answer:</strong> " +
            question.answer +
            "<br><br>" +
            "<strong>Working / Explanation:</strong> " +
            question.explanation;

        box.appendChild(answerBox);

        wrapper.appendChild(box);

    });


    area.appendChild(wrapper);

}
