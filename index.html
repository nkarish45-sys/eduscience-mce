<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EduScience MCE Study Hub</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f4f7fb;
color:#222;
}

header{
background:#123c69;
color:white;
padding:25px 15px;
text-align:center;
}

header h1{
margin:0;
font-size:30px;
}

header p{
margin:8px 0 0;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:12px;
box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:12px;
}

.stat{
background:#eaf2fb;
padding:18px;
border-radius:10px;
text-align:center;
}

.stat strong{
display:block;
font-size:25px;
color:#123c69;
}

label{
display:block;
font-weight:bold;
margin-top:12px;
margin-bottom:6px;
}

select{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:0;
border-radius:8px;
background:#123c69;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.button-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:10px;
}

.question{
background:#fafafa;
border:1px solid #ddd;
border-radius:10px;
padding:16px;
margin:12px 0;
}

.question-number{
font-weight:bold;
font-size:17px;
}

.topic{
font-size:13px;
color:#666;
margin-top:6px;
}

.answer{
display:none;
margin-top:12px;
padding:12px;
background:#e8f5e9;
border-left:5px solid #2e7d32;
border-radius:5px;
}

footer{
text-align:center;
padding:25px;
color:#666;
}

</style>
</head>

<body>

<header>

<h1>EduScience MCE Study Hub</h1>

<p>
University Learning • CAT Practice • Revision • Mock Papers
</p>

</header>


<div class="container">


<div class="card">

<h2>Select Your University</h2>

<select id="university">

<option value="">
Select University
</option>

<option>
Egerton University
</option>

<option>
University of Nairobi
</option>

<option>
Kenyatta University
</option>

<option>
Jomo Kenyatta University of Agriculture and Technology
</option>

<option>
Maseno University
</option>

</select>

</div>


<div class="card">

<h2>Select Unit</h2>

<select id="course">

<option value="">
Select Unit
</option>

<option value="MATH 132">
MATH 132
</option>

<option value="CHEM 110">
CHEM 110
</option>

<option value="MATH 112">
MATH 112
</option>

<option value="COMP 101">
COMP 101
</option>

<option value="EPSC 121">
EPSC 121 — Psychology
</option>

<option value="EDFO 111">
EDFO 111 — History of Education
</option>

<option value="CHEM 120">
CHEM 120
</option>

</select>

</div>


<div class="card">

<h2>Select Topic</h2>

<select id="topic">

<option value="">
Select Unit First
</option>

</select>

</div>


<div class="card">

<div class="stats">

<div class="stat">
<strong>5</strong>
Universities
</div>

<div class="stat">
<strong>7</strong>
Units
</div>

<div class="stat">
<strong>210</strong>
CAT Questions
</div>

<div class="stat">
<strong>490</strong>
Revision Questions
</div>

<div class="stat">
<strong>700+</strong>
Questions
</div>

<div class="stat">
<strong>40+</strong>
Mock Papers
</div>

</div>

</div>


<div class="card">

<h2>Practice</h2>

<div class="button-grid">

<button onclick="openCAT()">
CAT Practice
</button>

<button onclick="openRevision()">
Revision Questions
</button>

<button onclick="openMocks()">
Mock Papers
</button>

</div>

</div>


<div id="content"></div>


</div>


<footer>

EduScience MCE Study Hub

</footer>


<script>

/* ==========================================
   TOPICS
========================================== */

const topics = {

"MATH 132":[

"Equation of a straight line",

"Equation of a circle",

"Parabola",

"Hyperbola",

"Ellipse",

"Vector operations",

"Vectors in Cartesian coordinates",

"Equation of a line using vectors and Cartesian coordinates",

"Equation of a plane using vectors and Cartesian coordinates"

],


"CHEM 110":[

"History of the atom",

"Stoichiometry - mole concept",

"Quantum theory and atomic structures",

"Trends in physical properties of group elements",

"Graphic materials",

"Chemical bonding"

],


"MATH 112":[

"Sequence and series",

"Trigonometry",

"Set theory",

"Mathematical logics",

"Number systems",

"Relations and mapping",

"Functions",

"Permutations and combinations",

"The binomial theorem"

],


"COMP 101":[

"Nature and functions of computers",

"Hardware",

"Software",

"Firmware",

"Power",

"Data processing",

"Information systems",

"CPU",

"Motherboard",

"RAM",

"ROM",

"Hard drive",

"Input and output devices",

"Removable storage",

"Computer networks",

"Internet",

"Windows operating environment",

"Electronic mail",

"World Wide Web",

"Word processing",

"Database",

"Electronic spreadsheets"

],


"EPSC 121":[

"Introduction to Psychology",

"Psychology as a Science",

"Goals of Psychology",

"Historical Development of Psychology",

"Branches and Schools of Psychology",

"Structuralism",

"Functionalism",

"Behaviourism",

"Humanistic Perspective",

"Cognitive Perspective",

"Biological Perspective",

"Eclectic Perspective",

"Heredity and Environment",

"Biological Basis of Behaviour",

"Nervous System",

"CNS and PNS",

"Neurons",

"Autonomic Nervous System",

"Sympathetic and Parasympathetic Divisions",

"Endocrine System",

"Brain and Main Divisions",

"Spinal Cord",

"Motivation",

"Intrinsic and Extrinsic Motivation",

"Maslow's Hierarchy of Needs"

],


"EDFO 111":[

"History and Development of Education",

"Foundations of Education",

"Spartan Education",

"Athenian Education",

"Spartan and Athenian Education",

"Religious Foundations of Education",

"Islamic Education",

"Jewish Education",

"Christian Education"

],


"CHEM 120":[

"Gases and Kinetic Molecular Theory",

"Chemical Equilibrium",

"Ionic Equilibrium",

"Acids and Bases",

"Thermochemistry",

"Chemical Kinetics",

"Electrochemistry"

]

};


/* ==========================================
   LINK TOPICS TO UNIT
========================================== */

const courseBox =
document.getElementById("course");

const topicBox =
document.getElementById("topic");


courseBox.addEventListener("change",function(){

topicBox.innerHTML =
'<option value="">All Topics</option>';

const selected =
this.value;

if(topics[selected]){

topics[selected].forEach(function(topic){

const option =
document.createElement("option");

option.value=topic;

option.textContent=topic;

topicBox.appendChild(option);

});

}

});


/* ==========================================
   QUESTION SYSTEM
========================================== */

/*
The complete question bank will be connected
to this system.

Each question uses:

topic
question
answer
explanation
*/


const questionBank = {};


/* ==========================================
   QUESTION DISPLAY
========================================== */

function displayQuestions(title,questions){

const content =
document.getElementById("content");

content.innerHTML="";


const card =
document.createElement("div");

card.className="card";


const heading =
document.createElement("h2");

heading.textContent=title;

card.appendChild(heading);


if(questions.length===0){

const message =
document.createElement("p");

message.textContent =
"No questions have been loaded for this unit yet.";

card.appendChild(message);

content.appendChild(card);

return;

}


questions.forEach(function(item,index){

const question =
document.createElement("div");

question.className="question";


question.innerHTML=`

<div class="question-number">

${index+1}. ${item.question}

</div>

<div class="topic">

Topic: ${item.topic}

</div>

<button onclick="toggleAnswer(${index})">

Show Answer

</button>

<div class="answer" id="answer-${index}">

<strong>Answer:</strong>

${item.answer}

<br><br>

<strong>Explanation:</strong>

${item.explanation}

</div>

`;


card.appendChild(question);

});


content.appendChild(card);

}


function toggleAnswer(number){

const answer =
document.getElementById(
"answer-"+number
);

if(answer.style.display==="block"){

answer.style.display="none";

}else{

answer.style.display="block";

}

}


/* ==========================================
   FILTER QUESTIONS
========================================== */

function filterQuestions(list){

const selectedTopic =
topicBox.value;

if(!selectedTopic){

return list;

}

return list.filter(function(item){

return item.topic===selectedTopic;

});

}


/* ==========================================
   CAT
========================================== */

function openCAT(){

const course =
courseBox.value;

if(!course){

alert("Please select a unit first.");

return;

}

const list =
questionBank[course]?.cat || [];

displayQuestions(

course+" — CAT Practice",

filterQuestions(list)

);

}


/* ==========================================
   REVISION
========================================== */

function openRevision(){

const course =
courseBox.value;

if(!course){

alert("Please select a unit first.");

return;

}

const list =
questionBank[course]?.revision || [];

displayQuestions(

course+" — Revision Questions",

filterQuestions(list)

);

}


/* ==========================================
   MOCK PAPERS
========================================== */

function openMocks(){

const content =
document.getElementById("content");

content.innerHTML=`

<div class="card">

<h2>Original Mock Papers</h2>

<p>

These are original practice papers created for
EduScience MCE Study Hub. They are not presented
as official university past papers.

</p>

<div class="button-grid">

${Array.from(
{length:40},
(_,i)=>

`<button onclick="generateMock(${i+1})">

Mock Paper ${i+1}

</button>`

).join("")}

</div>

</div>

`;

}


/* ==========================================
   MOCK PAPER GENERATOR
========================================== */

function generateMock(number){

const course =
courseBox.value;

if(!course){

alert("Please select a unit first.");

return;

}

const questions =
[

...(questionBank[course]?.cat || []),

...(questionBank[course]?.revision || [])

].slice(0,30);


if(!questions.length){

alert(
"The question bank for this unit is being added."
);

return;

}


let paper =

course+
" — ORIGINAL MOCK PAPER "+
number+
"\n\n";


questions.forEach(function(q,index){

paper +=

(index+1)+
". "+
q.question+
"\n\n";

});


const blob =
new Blob([paper],{
type:"text/plain"
});


const url =
URL.createObjectURL(blob);


const link =
document.createElement("a");

link.href=url;

link.download =
course.replaceAll(" ","_")+
"_Mock_Paper_"+
number+
".txt";

link.click();

URL.revokeObjectURL(url);

}

</script>

</body>
</html>
